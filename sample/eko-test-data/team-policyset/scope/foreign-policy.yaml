apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: e2e-foreign
  namespace: team-x
  annotations:
    policies.kyverno.io/title: e2e-foreign
    policies.kyverno.io/category: Operator E2E
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Operator e2e fixture for namespace-scoped (team) PolicySets. Requires the
      label `app` on Pods. Audit mode only; do not rename or remove.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-app-label
      match:
        any:
        - resources:
            kinds:
              - Pod
      validate:
        message: >-
          The label `app` is required (team-x is not targeted; must be skipped).
        pattern:
          metadata:
            labels:
              app: "?*"
