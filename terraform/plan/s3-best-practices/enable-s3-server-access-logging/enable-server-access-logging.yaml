apiVersion: policies.kyverno.io/v1alpha1
kind: ValidatingPolicy
metadata:
  name: enable-s3-server-access-logging
  annotations:
    policies.kyverno.io/title: Enable S3 Server Access Logging
    policies.kyverno.io/category: AWS S3 Security Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Server access logging provides detailed records for the
      requests that are made to an Amazon S3 bucket. Server access
      logs are useful for many applications. For example, access
      log information can be useful in security and access audits.
      This information can also help you learn about your customer
      base and understand your Amazon S3 bill.
spec:
  validationActions:
    - Deny
  evaluation:
    mode: JSON
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["*"]
        operations: ["CREATE", "UPDATE"]
  matchConditions:
    - name: is-terraform-plan
      expression: "has(object.resource_changes) && has(object.terraform_version)"
    - name: has-s3-bucket-or-logging
      expression: |
        object.resource_changes.exists(rc,
          rc.mode == 'managed'
          && (rc.type == 'aws_s3_bucket' || rc.type == 'aws_s3_bucket_logging')
          && rc.change.actions.exists(a, a == 'create' || a == 'update'))
  variables:
    - name: resource_changes
      expression: |
        object.resource_changes.filter(rc,
          rc.mode == 'managed'
          && rc.change.after != null)
    - name: logging_resources
      expression: "variables.resource_changes.filter(rc, rc.type == 'aws_s3_bucket_logging')"
    - name: s3_buckets
      expression: |
        variables.resource_changes.filter(rc,
          rc.type == 'aws_s3_bucket'
          && rc.change.actions.exists(a, a == 'create' || a == 'update'))
  validations:
    - expression: "variables.logging_resources.size() > 0"
      message: "Use the aws_s3_bucket_logging resource to enable server access logging."
