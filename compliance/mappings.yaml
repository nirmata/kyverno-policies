# ── Non-automatable controls ────────────────────────────────────────────────────
# Controls in each standard that CANNOT be assessed by Kyverno policy scans.
# These require organizational processes, cloud provider APIs, or runtime tooling
# outside the Kubernetes API. Documented here so reports can flag them explicitly
# rather than silently omitting them.

non-automatable:

  soc2:
    - id: "CC1.1–CC1.5"
      family: "Control Environment"
      reason: "Board oversight, HR policies, organizational accountability structures — requires governance documentation review"
    - id: "CC2.1–CC2.3"
      family: "Communication and Information"
      reason: "Internal and external communication of control objectives — requires policy and process documentation"
    - id: "CC3.1–CC3.4"
      family: "Risk Assessment"
      reason: "Risk identification, fraud risk assessment, and change risk monitoring — requires risk register and GRC tooling"
    - id: "CC4.1–CC4.2"
      family: "Monitoring Activities"
      reason: "Ongoing evaluation of internal control effectiveness — requires audit logs, SOC reviews, and management sign-off"
    - id: "CC5.1–CC5.3"
      family: "Control Activities"
      reason: "Policy deployment and technology general controls governance — requires documented policies and procedures"
    - id: "CC6.2"
      family: "Logical Access — User Provisioning"
      reason: "User registration, MFA enrollment, credential issuance workflows — requires IAM (Okta, AWS IAM, etc.)"
    - id: "CC6.4"
      family: "Physical Access Controls"
      reason: "Data center physical security and environmental protections — requires cloud provider SOC 2 attestation (AWS, GCP, Azure)"
    - id: "CC6.5"
      family: "Asset Disposal"
      reason: "Discontinuing logical and physical protections only after data on retired assets can no longer be read or recovered — requires media sanitization records and cloud provider SOC 2 attestation"
    - id: "CC7.1"
      family: "Configuration Monitoring"
      reason: "Runtime configuration drift and anomaly detection — requires SIEM or cloud-native monitoring (CloudWatch, Datadog)"
    - id: "CC7.3–CC7.5"
      family: "Security Incident Response"
      reason: "Incident triage, response, and recovery procedures — requires documented runbooks and incident management tooling"
    - id: "CC9.1–CC9.2"
      family: "Risk Mitigation and Vendor Management"
      reason: "Business risk management and vendor/third-party risk assessment — requires vendor contracts and risk documentation"
    - id: "C1.1–C1.2"
      family: "Confidentiality"
      reason: "Data classification and encryption at rest — requires cloud KMS configuration review and data governance policies"
    - id: "PI1.1–PI1.5"
      family: "Processing Integrity"
      reason: "Transaction completeness, accuracy, and data quality — requires application-level audit trails and data validation controls"

  nist-800-53:
    - id: "AC-2, AC-5"
      family: "Account Management / Separation of Duties"
      reason: "User lifecycle management and SoD enforcement — requires IAM system review"
    - id: "AT-2, AT-3"
      family: "Awareness and Training"
      reason: "Security awareness training programs — requires HR/LMS documentation"
    - id: "AU-2–AU-12"
      family: "Audit and Accountability"
      reason: "Audit log generation and review — requires SIEM/CloudTrail/Audit Logging configuration"
    - id: "CA-2, CA-7"
      family: "Assessment and Authorization"
      reason: "Control assessments and continuous monitoring program — requires GRC tooling"
    - id: "CP-2–CP-10"
      family: "Contingency Planning"
      reason: "Disaster recovery and business continuity planning — requires DR plan documentation and testing"
    - id: "IR-4–IR-8"
      family: "Incident Response"
      reason: "Incident handling procedures and testing — requires documented runbooks"
    - id: "MA-2–MA-6"
      family: "Maintenance"
      reason: "System maintenance controls — requires change management process documentation"
    - id: "MP-2–MP-8"
      family: "Media Protection"
      reason: "Storage media handling and disposal — requires data center/cloud provider attestation"
    - id: "PE-2–PE-20"
      family: "Physical and Environmental Protection"
      reason: "Physical access and environmental controls — requires cloud provider SOC 2 / ISO 27001 attestation"
    - id: "PL-2, PL-4"
      family: "Planning"
      reason: "System security plan and rules of behavior — requires documented security policies"
    - id: "PS-3–PS-9"
      family: "Personnel Security"
      reason: "Background screening, termination procedures — requires HR process documentation"
    - id: "RA-3, RA-5"
      family: "Risk Assessment / Vulnerability Scanning"
      reason: "System risk assessment and vulnerability scanning — requires scanner tooling (Trivy, Grype, Qualys)"
    - id: "SA-9–SA-12"
      family: "Supply Chain / External Services"
      reason: "Third-party service provider controls — requires vendor assessments and SLAs"

  nsa-cisa:
    - id: "Sec.4.x"
      family: "Audit Logging and Threat Detection"
      reason: "Kubernetes audit log configuration and SIEM integration — requires cloud provider audit log setup"
    - id: "Sec.5.x"
      family: "Vulnerability Management"
      reason: "Container image and dependency scanning — requires scanner tooling (Trivy, Grype, ECR scanning)"
    - id: "Sec.6.x"
      family: "Physical Security and Cloud Provider Controls"
      reason: "Data center physical security — covered by cloud provider SOC 2 attestation"
    - id: "Sec.7.x"
      family: "Cloud Provider Configuration"
      reason: "EKS/AKS/GKE control plane settings — requires aws/az/gcloud CLI and cloud console review"

  iso27001:
    - id: "A.5.x"
      family: "Information Security Policies"
      reason: "Organizational security policy documentation and governance — requires documented ISMS"
    - id: "A.6.x"
      family: "Organization of Information Security"
      reason: "Roles, responsibilities, and contact with authorities — requires HR and governance documentation"
    - id: "A.7.x"
      family: "Human Resource Security"
      reason: "Background checks, training, disciplinary process — requires HR process documentation"
    - id: "A.8.x"
      family: "Asset Management"
      reason: "Asset inventory and classification — requires CMDB or asset management tooling"
    - id: "A.11.x"
      family: "Physical and Environmental Security"
      reason: "Physical access controls and environmental protections — requires cloud provider ISO 27001 attestation"
    - id: "A.15.x"
      family: "Supplier Relationships"
      reason: "Vendor security management — requires third-party risk assessments and contracts"
    - id: "A.16.x"
      family: "Information Security Incident Management"
      reason: "Incident response procedures and reporting — requires documented runbooks"
    - id: "A.17.x"
      family: "Business Continuity Management"
      reason: "DR planning and BCP — requires documented continuity plans and test results"
    - id: "A.18.x"
      family: "Compliance"
      reason: "Legal and regulatory compliance reviews — requires legal counsel and audit documentation"

  pci-dss:
    - id: "2.2, 2.3"
      family: "System Configuration Standards"
      reason: "Hardening standards and non-console administrative access — requires node-level configuration review"
    - id: "3.x"
      family: "Cardholder Data Protection"
      reason: "Encryption of stored cardholder data — requires application-level and database encryption review"
    - id: "6.3, 6.4"
      family: "Vulnerability Management"
      reason: "Secure development lifecycle and penetration testing — requires SAST/DAST tooling and pentest reports"
    - id: "9.x"
      family: "Physical Access"
      reason: "Physical access to cardholder data environments — requires data center access controls review"
    - id: "10.x"
      family: "Audit Logging"
      reason: "Log monitoring and retention — requires SIEM and log management tooling"
    - id: "11.3, 11.4"
      family: "Penetration Testing and IDS/IPS"
      reason: "Penetration testing and intrusion detection — requires external pentest and runtime security tooling"

  # #2098 review: pss-baseline's control 5 (Disallow Host Ports Range, compliancecontrols/
  # pss-baseline-v1.csv) has no implementing Kyverno policy in this repo's bundle
  # (disallow-host-ports-range doesn't exist alongside disallow-host-ports) — listed here rather
  # than silently dropped, so reports and control counts still account for all 13 legacy controls.
  pss-baseline:
    - id: "5"
      family: "Disallow Host Ports Range"
      reason: "Restricting hostPort to a specific allowed list (rather than disallowing it outright, control 4) has no corresponding Kyverno policy in this bundle"

  rbi:
    - id: "ITGRC.4–8"
      family: "IT Governance (Board, ITSC, IT Steering Committee, Head of IT)"
      reason: "Board-level governance structure, committee charters, and Head of IT appointment — requires governance documentation and board minutes"
    - id: "ITGRC.9(b)(d)(e)"
      family: "IT Service Management (SLM, EOS/AMC tracking, technology refresh)"
      reason: "Service-level management process, end-of-support monitoring, and technology refresh planning — requires ITSM tooling and vendor contracts"
    - id: "ITGRC.10(a)–(e)"
      family: "Third-Party Arrangements"
      reason: "Concentration risk, conflict-of-interest, and single-point-of-failure assessments — requires vendor risk register"
    - id: "ITGRC.10(f) [signing]"
      family: "Supply Chain — cryptographic image signing"
      reason: "Cosign verification requires an RE-specific public key or Fulcio/Rekor identity; the policy library ships a demo-scoped policy with a placeholder key, so it cannot be scanned generically. Registry digest pinning and tag immutability are mapped instead."
    - id: "ITGRC.11(c)"
      family: "Capacity Management Review"
      reason: "ITSC review of capacity assessments and remedial measures — requires committee minutes"
    - id: "ITGRC.12"
      family: "Project Management"
      reason: "Project methodology, enterprise architecture, source-code escrow, and vendor vulnerability-free certificates — requires contracts and SDLC documentation"
    - id: "ITGRC.13(a)(b)"
      family: "Change and Patch Management"
      reason: "Business-impact assessment and approval workflow for patches/changes — requires a change management system (ServiceNow, Jira)"
    - id: "ITGRC.14"
      family: "Data Migration Controls"
      reason: "Documented migration policy with business-user and application-owner signoffs — requires process documentation"
    - id: "ITGRC.15"
      family: "Audit Trails"
      reason: "Application audit logging, forensic sufficiency, and regular log monitoring — requires Kubernetes audit-log configuration and a SIEM (CloudTrail, Splunk)"
    - id: "ITGRC.16 [at-rest]"
      family: "Cryptographic Controls — data at rest"
      reason: "Key length, algorithm, and cipher-suite strength for stored data — requires cloud KMS and etcd encryption-provider review outside the Kubernetes API"
    - id: "ITGRC.17"
      family: "Straight Through Processing"
      reason: "Prevention of manual intervention or modification of in-flight transaction data — application-level control"
    - id: "ITGRC.18"
      family: "Physical and Environmental Controls"
      reason: "Data centre physical security and environmental protections — covered by cloud provider SOC 2 / ISO 27001 attestation"
    - id: "ITGRC.19(c), 20"
      family: "Multi-Factor Authentication and Teleworking"
      reason: "MFA for privileged users and secure remote access — requires identity provider (Okta, AWS IAM, Entra ID) configuration review"
    - id: "ITGRC.21(b)(c)"
      family: "Metrics (risk-based metrics, IT maturity scorecard)"
      reason: "Recovery objectives for non-critical systems and IT performance scorecards — requires DR test results and management reporting"
    - id: "ITGRC.22, 25"
      family: "Periodic IT Risk Review and Risk Assessment"
      reason: "Periodic risk review by the Board/ITSC and asset-level risk assessment — requires GRC tooling and a risk register"
    - id: "ITGRC.23(b) [SoD]"
      family: "IT Risk Framework — roles and accountability"
      reason: "Identification and elimination of role conflicts and accountability gaps across stakeholders including third-party personnel — RBAC policies cover the in-cluster portion only"
    - id: "ITGRC.24"
      family: "Information Security Policy, Cyber Security Policy, ISC and CISO"
      reason: "Policy documents, Information Security Committee constitution, CISO appointment, reporting line, and quarterly Board review — requires organisational documentation"
    - id: "ITGRC.26 [VA/PT]"
      family: "Vulnerability Assessment / Penetration Testing"
      reason: "VA/PT execution before deployment and periodically thereafter — requires image and infrastructure scanners (Trivy, Grype) and pentest reports. The attestation-gating facet of ITGRC.26 IS automated (require-image-digest); this faceted id avoids emitting a duplicate control row for the manual facet, matching the [signing]/[at-rest]/[SoD] convention above"
    - id: "ITGRC.27"
      family: "Cyber Incident Response and Recovery Management"
      reason: "Incident response plan and RBI reporting within prescribed timelines — requires runbooks and incident management tooling"
    - id: "ITGRC.28, 29"
      family: "Business Continuity and Disaster Recovery Management"
      reason: "BCP/DR policy, DR drills, and RTO/RPO validation — requires DR test evidence"
    - id: "ITGRC.30"
      family: "Information Systems (IS) Audit"
      reason: "Independent IS audit charter, plan, and Audit Committee reporting — requires internal audit documentation"
    - id: "ITOS.4–16"
      family: "IT Outsourcing — governance, due diligence, and agreements"
      reason: "Outsourcing policy, Board and Senior Management roles, service-provider due diligence, and contractual audit rights — requires contracts and vendor assessments"
    - id: "ITOS.17(a)(b)(e)(f)(h)–(j)"
      family: "IT Outsourcing — risk management framework"
      reason: "Risk framework documentation, cyber incident reporting to RBI within 6 hours of detection, and concentration-risk assessment — requires process documentation and vendor SLAs"
    - id: "ITOS.18"
      family: "IT Outsourcing — service-provider BCP/DR"
      reason: "Service-provider BCP/DRP testing and data-isolation guarantees on termination — requires vendor attestations"
    - id: "ITOS.19–22"
      family: "IT Outsourcing — monitoring, group outsourcing, cross-border, exit strategy"
      reason: "Ongoing service-provider monitoring structure, cross-border data-access controls, and a documented exit strategy — requires contracts and management reporting"
