apiVersion: nirmata.io/v1alpha1
kind: ComplianceMappings
metadata:
  name: kyverno-compliance-mappings
  annotations:
    description: >-
      Authoritative mapping from Kyverno policies to compliance standard control IDs.
      Use this file as the machine-queryable source of truth for control coverage.
      Human-readable standards annotations are also present on each policy YAML.

# CIS controls requiring cloud/node access (not enforceable via Kyverno alone):
# cis-eks:  2.x (EKS control plane config), 3.x (worker node config), 5.3-5.5 (networking/storage)
# cis-kubernetes: 1.x (control plane), 2.x (etcd), 3.x (control plane config), 4.x (worker nodes)
# These controls require aws CLI, SSH, or kubeadm access and are documented in the skills/cis-benchmark-scan skill.

# ── Standard metadata ─────────────────────────────────────────────────────────
# display_name / prefer_vpol / sources are read by nctl and policies-service; domain / type are
# used by the Nirmata Control Hub standards picker (ignored by nctl).
standards:
  cis-aks:        { display_name: "CIS Azure AKS Benchmark v2.0.0", domain: [kubernetes, cloud-infra] }
  cis-eks:        { display_name: "CIS Amazon EKS Benchmark v2.0.0", domain: [kubernetes, cloud-infra] }
  cis-gke:        { display_name: "CIS Google GKE Benchmark v2.0.0", domain: [kubernetes, cloud-infra] }
  cis-kubernetes: { display_name: "CIS Kubernetes Benchmark v2.0.1", domain: [kubernetes] }
  iso27001:       { display_name: "ISO 27001", domain: [governance] }
  nist-800-53:    { display_name: "NIST SP 800-53", domain: [governance] }
  nsa-cisa:       { display_name: "NSA/CISA Kubernetes Hardening", domain: [kubernetes] }
  pci-dss:        { display_name: "PCI DSS", domain: [data-protection, governance] }
  pss-baseline:   { display_name: "Pod Security Standards - Baseline", domain: [kubernetes] }
  pss-restricted: { display_name: "Pod Security Standards - Restricted", domain: [kubernetes] }
  rbac-best-practices: { display_name: "RBAC Best Practices", domain: [kubernetes, identity-rbac] }
  rbi:
    display_name: "RBI Master Directions (IT Governance + IT Outsourcing)"
    prefer_vpol: true
    type: industry
    domain: [governance]
    sources:
      - id: ITGRC
        title: "RBI (Information Technology Governance, Risk, Controls and Assurance Practices) Directions, 2023"
        ref: "RBI/DoS/2023-24/107, DoS.CO.CSITEG/SEC.7/31.01.015/2023-24 (07-Nov-2023)"
        effective: "2024-04-01"
      - id: ITOS
        title: "RBI (Outsourcing of Information Technology Services) Directions, 2023"
        ref: "RBI/2023-24/102, DoS.CO.CSITEG/SEC.1/31.01.015/2023-24 (10-Apr-2023)"
        effective: "2023-10-01"
  soc2:           { display_name: "SOC 2 Type II", domain: [governance] }

policies:
  # --- CIS common policies (compliance/cis/) ---

  restrict-cluster-admin-binding:
    path: compliance/cis/common/restrict-cluster-admin-binding/
    cluster_scoped: true
    standards:      [cis-eks, cis-kubernetes, cis-aks, cis-gke, soc2, iso27001, nsa-cisa, nist-800-53, rbi]
    cis-eks:        ["4.1.1"]
    cis-kubernetes: ["5.1.1"]
    cis-aks:        ["4.1.1"]
    cis-gke:        ["4.1.1"]
    soc2:           ["CC6.1", "CC6.3"]
    iso27001:       ["A.9.4.1"]
    nsa-cisa:       ["Sec.3.1"]
    nist-800-53:    ["AC-2", "AC-6"]
    rbi:            ["ITGRC.19(a)", "ITGRC.19(b)", "ITGRC.23(b)"]

  restrict-secret-role-access:
    path: compliance/cis/common/restrict-secret-role-access/
    cluster_scoped: true
    standards:      [cis-eks, cis-kubernetes, cis-aks, cis-gke, soc2, nsa-cisa, nist-800-53, rbi]
    cis-eks:        ["4.1.2"]
    cis-kubernetes: ["5.1.2"]
    cis-aks:        ["4.1.2"]
    cis-gke:        ["4.1.2"]
    soc2:           ["CC6.3"]
    nsa-cisa:       ["Sec.1.6", "Sec.3.1"]
    nist-800-53:    ["AC-3", "IA-5"]
    rbi:            ["ITGRC.19(a)", "ITGRC.23(d)", "ITOS.17(d)"]

  restrict-pod-creation-access:
    path: compliance/cis/common/restrict-pod-creation-access/
    cluster_scoped: true
    standards:      [cis-eks, cis-kubernetes, cis-aks, cis-gke, soc2, nsa-cisa, nist-800-53, rbi]
    cis-eks:        ["4.1.4"]
    cis-kubernetes: ["5.1.4"]
    cis-aks:        ["4.1.4"]
    soc2:           ["CC6.3"]
    nsa-cisa:       ["Sec.3.1"]
    nist-800-53:    ["AC-3", "AC-6"]
    rbi:            ["ITGRC.19(a)", "ITGRC.23(b)"]

  require-network-policy:
    path: compliance/cis/common/require-network-policy/
    cluster_scoped: true  # matches Namespace (cluster-scoped resource); must run in cluster-wide scan pass
    standards:      [cis-eks, cis-kubernetes, cis-aks, cis-gke, soc2, nsa-cisa, nist-800-53, rbi]
    cis-eks:        ["4.3.2"]
    cis-kubernetes: ["5.3.2"]
    cis-aks:        ["4.4.2"]
    cis-gke:        ["4.3.2"]
    soc2:           ["CC6.6", "A1.2"]
    nsa-cisa:       ["Sec.2.1"]
    nist-800-53:    ["SC-7"]
    rbi:            ["ITGRC.23(d)", "ITOS.17(g)"]

  require-pss-labels:
    path: compliance/cis/common/require-pss-labels/
    cluster_scoped: true  # matches Namespace (cluster-scoped resource); must run in cluster-wide scan pass
    standards:      [cis-eks, cis-kubernetes, cis-aks, cis-gke, nsa-cisa, nist-800-53, rbi]
    cis-kubernetes: ["5.2.1"]
    cis-gke:        ["4.2.1"]
    nsa-cisa:       ["Sec.1.1"]
    nist-800-53:    ["CM-6", "CM-7"]
    rbi:            ["ITGRC.23(a)", "ITGRC.25"]

  require-ingress-tls:
    path: compliance/cis/common/require-ingress-tls/
    standards:      [cis-eks, cis-kubernetes, cis-aks, cis-gke, soc2, pci-dss, nsa-cisa, nist-800-53, rbi]
    cis-eks:        ["5.4.4"]
    cis-aks:        ["5.4.5"]
    cis-gke:        ["5.6.7"]
    soc2:           ["CC6.7"]
    pci-dss:        ["4.1"]
    nsa-cisa:       ["Sec.2.2"]
    nist-800-53:    ["SC-8", "AC-17"]
    rbi:            ["ITGRC.16", "ITGRC.23(d)"]

  # --- CIS EKS-specific policies (compliance/cis/eks/) ---

  restrict-secrets-as-env-vars:
    path: compliance/cis/eks/restrict-secrets-as-env-vars/
    standards:      [cis-eks, cis-kubernetes, cis-aks, cis-gke, soc2, iso27001, nsa-cisa, nist-800-53, rbi]
    cis-eks:        ["4.4.1"]
    cis-kubernetes: ["5.4.1"]
    cis-aks:        ["4.5.1"]
    cis-gke:        ["4.4.1"]
    soc2:           ["CC6.7"]
    iso27001:       ["A.10.1.1"]
    nsa-cisa:       ["Sec.1.6"]
    nist-800-53:    ["IA-5", "SC-28"]
    rbi:            ["ITGRC.23(d)", "ITOS.17(c)"]

  # --- Pod Security Standards (pod-security/baseline/) ---

  disallow-capabilities:
