apiVersion: v1
kind: Pod
metadata:
  labels:
    app: ml-training
    workload: ai
  name: ai-workload-with-dedicated-sa
  namespace: default
spec:
  containers:
  - image: tensorflow/tensorflow:latest
    name: tensorflow
  serviceAccountName: ai-ml-service-account

