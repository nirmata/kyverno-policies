metadata:
  labels:
    component: ml
  name: ml-workload-with-dedicated-sa
  namespace: default
spec:
  containers:
  - image: pytorch/pytorch:latest
    name: pytorch
  serviceAccountName: machine-learning-sa

---
apiVersion: v1
kind: Pod
metadata:
  labels:
    type: machine-learning
  name: machine-learning-workload-pass
  namespace: default
spec:
  containers:
  - image: python:3.9
    name: scikit-learn
  serviceAccountName: ml-dedicated-sa

---
apiVersion: v1
kind: Pod
metadata:
  labels:
    workload: artificial-intelligence
  name: artificial-intelligence-workload-pass
  namespace: default
spec:
  containers:
