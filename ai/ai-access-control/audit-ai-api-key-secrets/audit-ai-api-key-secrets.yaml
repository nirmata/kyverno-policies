apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: audit-ai-api-key-secrets
  annotations:
    policies.kyverno.io/title: Audit AI API Key Secrets
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Audits Secret resources to detect AI service API keys stored in plain text format. Flags secrets containing recognizable API key patterns for OpenAI, Azure OpenAI, Google AI, Anthropic, and other AI services that should use proper secret management.
spec:
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["secrets"]
  validationActions: ["Audit"]
  validations:
  - expression: "!variables.hasAiApiKeyPattern"
    messageExpression: "'Secret contains potential AI API key in plain text. Consider using external secret management or encryption. Found suspicious key patterns matching AI service formats.'"
  variables:
  - name: secretData
    expression: "object.?data.orValue({})"
  - name: suspiciousKeys
    expression: "['api_key', 'apikey', 'api-key', 'openai_key', 'openai-key', 'openai_api_key', 'azure_openai_key', 'google_api_key', 'anthropic_key', 'claude_key', 'gemini_key', 'ai_key', 'ai-key', 'llm_key', 'llm-key', 'token', 'secret', 'credential']"
  - name: suspiciousKeyFound
    expression: "variables.secretData.exists(key, variables.suspiciousKeys.exists(pattern, key.lowerAscii().contains(pattern)))"
  - name: hasOpenAIPattern
    expression: "variables.secretData.exists(key, string(base64.decode(variables.secretData[key])).startsWith('sk-') && size(string(base64.decode(variables.secretData[key]))) > 32)"
  - name: hasGoogleAIPattern
    expression: "variables.secretData.exists(key, string(base64.decode(variables.secretData[key])).startsWith('AIzaSy') && size(string(base64.decode(variables.secretData[key]))) == 39)"
  - name: hasAnthropicPattern
    expression: "variables.secretData.exists(key, (string(base64.decode(variables.secretData[key])).startsWith('sk-ant-') || string(base64.decode(variables.secretData[key])).startsWith('claude-')) && size(string(base64.decode(variables.secretData[key]))) > 20)"
  - name: hasGenericLongKey
    expression: "variables.secretData.exists(key, size(string(base64.decode(variables.secretData[key]))) >= 32 && string(base64.decode(variables.secretData[key])).contains('key'))"
  - name: hasAiApiKeyPattern
    expression: "variables.hasOpenAIPattern || variables.hasGoogleAIPattern || variables.hasAnthropicPattern || (variables.suspiciousKeyFound && variables.hasGenericLongKey)"