apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-ai-model-card-annotations
  annotations:
    policies.kyverno.io/title: Require AI Model Card Annotations
    policies.kyverno.io/category: AI Governance
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Enforces AI regulatory compliance by requiring model card annotations on AI/ML workloads. Validates that AI model pods include comprehensive model card metadata covering purpose, capabilities, limitations, training data, performance metrics, and ethical considerations in accordance with EU AI Act and NIST AI RMF requirements.
spec:
  evaluation:
    background:
      enabled: true
  matchConditions:
  - name: is-ai-workload
    expression: "has(object.metadata.labels) && ('ai.workload/type' in object.metadata.labels || 'ml.workload/type' in object.metadata.labels || 'app.kubernetes.io/component' in object.metadata.labels && object.metadata.labels['app.kubernetes.io/component'] in ['ai-model', 'ml-model', 'inference-server', 'model-server'])"
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  validationActions: ["Audit"]
  validations:
  - expression: "size(variables.missingAnnotations) == 0"
    messageExpression: "'AI/ML workload must include all required model card annotations for regulatory compliance. Missing annotations: ' + variables.missingAnnotations.join(', ')"
  variables:
  - name: requiredModelCardAnnotations
    expression: "['ai.model-card/purpose', 'ai.model-card/capabilities', 'ai.model-card/limitations', 'ai.model-card/training-data', 'ai.model-card/performance-metrics', 'ai.model-card/ethical-considerations', 'ai.model-card/model-version', 'ai.model-card/risk-assessment']"
  - name: annotations
    expression: "object.metadata.?annotations.orValue({})"
  - name: missingAnnotations
    expression: "variables.requiredModelCardAnnotations.filter(annotation, !(annotation in variables.annotations))"
  - name: riskAssessmentKey
    expression: "'ai.model-card/risk-assessment'"
  - name: modelVersionKey
    expression: "'ai.model-card/model-version'"