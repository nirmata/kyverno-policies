    ai.model-card/purpose: "Computer vision model for image classification and object detection in autonomous vehicles"
    ai.model-card/risk-assessment: "medium"
    ai.model-card/training-data: "ImageNet dataset with 14M images, augmented with proprietary automotive dataset of 2M images"
