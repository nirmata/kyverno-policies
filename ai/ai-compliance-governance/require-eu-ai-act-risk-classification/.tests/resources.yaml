apiVersion: v1
kind: Pod
metadata:
  annotations:
    eu-ai-act.io/accuracy-monitoring: enabled
    eu-ai-act.io/data-governance: DGF-EU-GDPR-001
    eu-ai-act.io/human-oversight: continuous
    eu-ai-act.io/logging-level: detailed
    eu-ai-act.io/monitoring-system: prometheus
    eu-ai-act.io/quality-management: QMS-2024-001
    eu-ai-act.io/robustness-testing: passed
    eu-ai-act.io/transparency-documentation: TD-AI-SYS-001
  labels:
    app: ai-system
    eu-ai-act.io/risk-level: high
  name: compliant-high-risk-ai-pod
  namespace: default
spec:
  containers:
  - image: ai-registry/high-risk-model:v1.0
    name: ai-model

---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    eu-ai-act.io/accuracy-monitoring: continuous
    eu-ai-act.io/data-governance: GDPR-COMPLIANT-001
    eu-ai-act.io/human-oversight: periodic
    eu-ai-act.io/logging-level: comprehensive
    eu-ai-act.io/monitoring-system: datadog
    eu-ai-act.io/quality-management: ISO-13485-2024
    eu-ai-act.io/robustness-testing: ongoing
    eu-ai-act.io/transparency-documentation: https://docs.example.com/ai-transparency
  labels:
    app: ai-deployment
    eu-ai-act.io/risk-level: high
  name: compliant-ai-deployment
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-deployment
  template:
    metadata:
      labels:
        app: ai-deployment
    spec:
      containers:
      - image: ai-registry/compliant-service:latest
        name: ai-service

