apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-model-serving-non-root
  annotations:
    policies.kyverno.io/title: Require Model Serving Containers Run As Non-Root
    policies.kyverno.io/category: AI/ML Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Enforces security best practices by ensuring AI model serving containers do not run with root privileges, reducing the attack surface for inference workloads.
spec:
  evaluation:
    background:
      enabled: true
  matchConditions:
  - name: has-model-serving-labels
    expression: "has(object.metadata.labels) && ('app.kubernetes.io/component' in object.metadata.labels && object.metadata.labels['app.kubernetes.io/component'] in ['model-server', 'inference', 'serving'] || 'ml-framework' in object.metadata.labels || 'model-serving' in object.metadata.labels)"
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  validationActions: ["Audit"]
  validations:
  - expression: "(object.spec.?securityContext.?runAsNonRoot.orValue(false) == true && variables.allContainers.all(c, c.?securityContext.?runAsNonRoot.orValue(true) == true)) || variables.allContainers.all(c, c.?securityContext.?runAsNonRoot.orValue(false) == true)"
    messageExpression: "'Model serving containers must run as non-root. Either spec.securityContext.runAsNonRoot must be set to true, or all containers must have securityContext.runAsNonRoot set to true'"
  - expression: "object.spec.?securityContext.?runAsUser.orValue(1) != 0"
    messageExpression: "'Model serving containers cannot run as root user. The field spec.securityContext.runAsUser must not be set to 0'"
  - expression: "variables.allContainers.all(container, container.?securityContext.?runAsUser.orValue(1) != 0)"
    messageExpression: "'Model serving containers cannot run as root user. Container security contexts must not have runAsUser set to 0'"
  variables:
  - name: allContainers
    expression: "object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])"