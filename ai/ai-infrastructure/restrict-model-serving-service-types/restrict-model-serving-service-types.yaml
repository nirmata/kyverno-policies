apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-model-serving-service-types
  annotations:
    policies.kyverno.io/title: Restrict Model Serving Service Types
    policies.kyverno.io/category: AI/ML Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Restricts model serving workloads from using NodePort or LoadBalancer service types without explicit annotation approval, ensuring AI model endpoints are not inadvertently exposed publicly. Only allows ClusterIP by default unless there's an explicit bypass annotation.
spec:
  evaluation:
    background:
      enabled: true
  matchConditions:
  - name: is-model-serving-service
    expression: "has(object.metadata.labels) && ('ml.kyverno.io/model-serving' in object.metadata.labels || 'ai.kyverno.io/model-serving' in object.metadata.labels || 'app.kubernetes.io/component' in object.metadata.labels && object.metadata.labels['app.kubernetes.io/component'] in ['model-server', 'inference-server', 'ml-serving'])"
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["services"]
  validationActions: ["Audit"]
  validations:
  - expression: "!variables.isRestrictedServiceType || variables.hasExternalAccessApproval"
    messageExpression: "'Model serving service of type ' + variables.serviceType + ' is not allowed without explicit approval. Add annotation ml.kyverno.io/allow-external-access=true to bypass this restriction.'"
  variables:
  - name: serviceType
    expression: "object.spec.?type.orValue('ClusterIP')"
  - name: hasExternalAccessApproval
    expression: "has(object.metadata.annotations) && 'ml.kyverno.io/allow-external-access' in object.metadata.annotations && object.metadata.annotations['ml.kyverno.io/allow-external-access'] == 'true'"
  - name: isRestrictedServiceType
    expression: "variables.serviceType in ['NodePort', 'LoadBalancer']"