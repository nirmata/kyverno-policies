apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-model-registry-sources
  annotations:
    policies.kyverno.io/title: Restrict Model Registry Sources
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Restricts AI/ML workload containers to only pull images from approved model registries to enforce supply chain security and prevent use of untrusted or malicious model containers.
spec:
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  validationActions: ["Audit"]
  validations:
  - expression: "variables.allContainers.all(container, variables.approvedRegistries.exists(registry, container.image.startsWith(registry)))"
    messageExpression: "'Container image must be from an approved model registry. Found unapproved images: ' + variables.allContainers.filter(container, !variables.approvedRegistries.exists(registry, container.image.startsWith(registry))).map(container, container.image).join(', ') + '. Approved registries: ' + variables.approvedRegistries.join(', ')"
  variables:
  - name: approvedRegistries
    expression: "['registry.k8s.io/', 'gcr.io/kubeflow-images-public/', 'docker.io/tensorflow/', 'nvcr.io/nvidia/', 'mcr.microsoft.com/azureml/', 'public.ecr.aws/pytorch/', 'huggingface.co/', 'quay.io/modelmesh/', 'registry.redhat.io/ubi8/']"
  - name: allContainers
    expression: "object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])"