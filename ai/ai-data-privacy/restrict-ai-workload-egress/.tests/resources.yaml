apiVersion: v1
kind: Namespace
metadata:
  labels:
    workload-type: ai
  name: ai-training

---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    ai-workload: "true"
  name: ml-inference

---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-research

---
apiVersion: v1
kind: Namespace
metadata:
  name: data-ai-pipeline

---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    workload-type: web
  name: web-application

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valid-ai-netpol-internal-only
  namespace: ai-training
spec:
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
  - to:
    - podSelector:
        matchLabels:
          app: database
  podSelector: {}
  policyTypes:
  - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valid-ai-netpol-approved-endpoints
  namespace: ml-inference
spec:
  egress:
  - to:
    - ipBlock:
        cidr: 10.0.0.0/8
  - to:
    - ipBlock:
        cidr: 172.16.0.0/12
  podSelector: {}
  policyTypes:
  - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valid-ai-netpol-no-egress
  namespace: ai-research
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valid-ai-netpol-empty-egress
  namespace: data-ai-pipeline
spec:
  egress: []
  podSelector: {}
  policyTypes:
  - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: invalid-ai-netpol-unapproved-cidr
  namespace: ai-training
spec:
  egress:
  - to:
    - ipBlock:
        cidr: 8.8.8.8/32
  podSelector: {}
  policyTypes:
  - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: invalid-ai-netpol-empty-to-field
  namespace: ml-inference
spec:
  egress:
  - to: []
  podSelector: {}
  policyTypes:
  - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: invalid-ai-netpol-missing-egress-policy-type
  namespace: ai-research
spec:
  egress:
  - to:
    - ipBlock:
        cidr: 10.0.0.0/8
  podSelector: {}
  policyTypes:
  - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: invalid-ai-netpol-no-to-field
  namespace: data-ai-pipeline
spec:
  egress:
  - ports:
    - port: 443
      protocol: TCP
  podSelector: {}
  policyTypes:
  - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valid-non-ai-netpol-unrestricted
  namespace: web-application
spec:
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
  podSelector: {}
  policyTypes:
  - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valid-ai-netpol-mixed-selectors
  namespace: ai-training
spec:
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app: redis
  - to:
    - ipBlock:
        cidr: 192.168.1.0/24
  podSelector: {}
  policyTypes:
  - Egress