apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-ai-data-classification-labels
  annotations:
    policies.kyverno.io/title: Require Data Classification Labels for AI Workloads
    policies.kyverno.io/category: Data Governance
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Ensures that namespaces and pods processing AI/ML data have proper data classification labels for governance and compliance. Validates that AI workloads include required sensitivity classification metadata.
spec:
  evaluation:
    background:
      enabled: true
  matchConditions:
  - name: is-ai-workload
    expression: "has(object.metadata.labels) && ('workload.type/ai' in object.metadata.labels || 'workload.type/ml' in object.metadata.labels || 'app.category' in object.metadata.labels && object.metadata.labels['app.category'] in ['ai', 'ml', 'machine-learning', 'artificial-intelligence', 'data-science'] || 'component' in object.metadata.labels && object.metadata.labels['component'].contains('ai') || object.metadata.name.contains('ai-') || object.metadata.name.contains('ml-'))"
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["namespaces", "pods"]
  validationActions: ["Audit"]
  validations:
  - expression: "has(object.metadata.labels) && 'data.classification/sensitivity' in object.metadata.labels"
    messageExpression: "'AI/ML workloads must have data.classification/sensitivity label. Resource: ' + object.metadata.name + ' in namespace: ' + object.metadata.?namespace.orValue('N/A')"
  - expression: "'data.classification/sensitivity' in object.metadata.labels && object.metadata.labels['data.classification/sensitivity'] in variables.validClassifications"
    messageExpression: "'data.classification/sensitivity must be one of: ' + variables.validClassifications.join(', ') + '. Found: ' + object.metadata.labels['data.classification/sensitivity']"
  - expression: "!variables.isNamespace || (has(object.metadata.labels) && 'data.governance/owner' in object.metadata.labels)"
    messageExpression: "'AI/ML namespaces must specify data governance owner via data.governance/owner label'"
  - expression: "!variables.isPod || !has(object.metadata.labels) || !('data.classification/pii' in object.metadata.labels) || object.metadata.labels['data.classification/pii'] in ['true', 'false']"
    messageExpression: "'data.classification/pii label must be either true or false if specified'"
  - expression: "!variables.isPod || object.metadata.labels['data.classification/sensitivity'] != 'restricted' || (has(object.metadata.labels) && 'data.retention/period' in object.metadata.labels)"
    messageExpression: "'Pods with restricted data classification must specify data retention period via data.retention/period label'"
  variables:
  - name: validClassifications
    expression: "['public', 'internal', 'confidential', 'restricted']"
  - name: isNamespace
    expression: "object.kind == 'Namespace'"
  - name: isPod
    expression: "object.kind == 'Pod'"