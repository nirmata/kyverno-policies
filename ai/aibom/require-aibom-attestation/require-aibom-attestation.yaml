apiVersion: policies.kyverno.io/v1alpha1
kind: ImageValidatingPolicy
metadata:
  name: require-aibom-attestation
  annotations:
    policies.kyverno.io/title: Require AIBOM Attestation
    policies.kyverno.io/category: AI Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Requires every AI agent Pod image to carry (1) a valid Sigstore keyless
      image signature produced by the CI pipeline, and (2) a valid AI Bill of
      Materials (AIBOM) attestation of type https://nirmata.com/aibom/v1 signed
      by the same pipeline. Images that lack either artefact are denied at
      admission. The AIBOM is generated by `nctl agent aibom generate` and
      attached to the image digest with `cosign attest` during CI. Update
      matchImageReferences and the attestor subject to match your registry and
      GitHub organisation.
spec:
  validationActions: [Deny]
  webhookConfiguration:
    timeoutSeconds: 15
    failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    # Scope to your AI agent registry — update this glob to match your registry
    - glob: "registry.example.com/agents/*"
  attestors:
    - name: ciPipeline
      cosign:
        keyless:
          identities:
            # Update subject to match your GitHub org and CI workflow path
            - subject: "https://github.com/your-org/*/.github/workflows/*.yml@refs/heads/main"
              issuer: "https://token.actions.githubusercontent.com"
          ctlog:
            url: "https://rekor.sigstore.dev"
  attestations:
    - name: aibom
      intoto:
        # Must match the --type value passed to `cosign attest` in CI
        type: https://nirmata.com/aibom/v1
  validations:
    # Rule 1: image must be signed by the CI pipeline via Sigstore keyless
    - expression: >-
        images.containers.map(image,
          verifyImageSignatures(image, [attestors.ciPipeline])
        ).all(e, e > 0)
      message: "Image must be signed by the CI pipeline via Sigstore keyless signing."

    # Rule 2: image must have a valid AIBOM attestation from the CI pipeline
    - expression: >-
        images.containers.map(image,
          verifyAttestationSignatures(image, attestations.aibom, [attestors.ciPipeline])
        ).all(e, e > 0)
      message: "Image must have a valid AIBOM attestation (https://nirmata.com/aibom/v1) signed by the CI pipeline."
